[project]
name = "math-ml-vibes"
version = "0.1.0"
description = "A structured mathematics and machine-learning self-study workspace."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

